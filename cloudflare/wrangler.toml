name = "weather-station-api"
main = "src/index.js"
compatibility_date = "2026-07-19"

# Cloudflare Cron expressions run in UTC.  Every 15 minutes is well within
# Ambient's request limits and yields a durable archive even if the dashboard
# is never opened.
[triggers]
crons = ["*/15 * * * *"]

[[r2_buckets]]
binding = "WEATHER_ARCHIVE"
bucket_name = "weather-station-archive"

[vars]
# The Pages dashboard is the only allowed browser origin. Write endpoints
# additionally require ADMIN_TOKEN.
ALLOWED_ORIGIN = "https://weather-station-esf.pages.dev"
